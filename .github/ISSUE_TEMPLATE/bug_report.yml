name: Báo lỗi / Bug report
description: App chạy sai, báo lỗi hoặc làm mất save / Something is broken
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã báo lỗi. Nếu mở từ nút **Tạo issue** trong app, phiên bản, hệ điều hành và log đã được điền sẵn (đường dẫn thư mục người dùng và SteamID đã được che).
        Thanks for reporting. When opened from the app's **Create issue** button, version, OS and logs are prefilled (home folder paths and SteamIDs are masked).

  - type: textarea
    id: what-happened
    attributes:
      label: Chuyện gì đã xảy ra? / What happened?
      description: Mô tả lỗi và điều bạn mong đợi. / Describe the problem and what you expected.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Các bước để gặp lại lỗi / Steps to reproduce
      placeholder: |
        1. Mở tab Game / Open the Games tab
        2. Bấm Backup ở game ... / Click Backup on ...
        3. ...

  - type: input
    id: game
    attributes:
      label: Game liên quan (nếu có) / Game involved (if any)
      placeholder: "Phantom Blade Zero (4115450)"

  - type: input
    id: version
    attributes:
      label: Phiên bản Checkpoint / Checkpoint version
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Hệ điều hành / Operating system
      placeholder: "Windows 11 · x86_64 / Bazzite 42 · x86_64"
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: Nơi lưu backup / Backup location
      options:
        - Google Drive qua rclone / via rclone
        - Thư mục / Folder (Drive for Desktop…)
        - Chưa cấu hình / Not set up
        - Không rõ / Not sure

  - type: textarea
    id: logs
    attributes:
      label: Log
      description: |
        Mở thư mục log từ nút **Báo lỗi** trong app, hoặc:
        Windows `%LOCALAPPDATA%\Checkpoint\logs\checkpoint.log` · Linux `~/.local/share/Checkpoint/logs/checkpoint.log`.
        Log dài thì kéo thả file vào đây. / If the log is long, drag the file in.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Kiểm tra / Check
      options:
        - label: Tôi đã xem log và không có thông tin riêng tư nào tôi không muốn công khai. / I checked the log contains nothing private I don't want to share.
          required: true
