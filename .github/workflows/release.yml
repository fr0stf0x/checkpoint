name: Release

# Tag like v0.2.0 and push the tag: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to rebuild (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Unit test
        working-directory: src-tauri
        run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: ubuntu-22.04
            bundles: appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: System libraries for Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Take the version number from the tag
        shell: bash
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $TAG is not in the vX.Y.Z format" >&2
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          ' "$VERSION"
          sed -i.bak -E "0,/^version = \".*\"/s//version = \"$VERSION\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The release notes start with this version's section of CHANGELOG.md
      - name: Extract this version's changelog
        id: notes
        shell: bash
        run: |
          NOTES=$(awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d')
          if [ -z "$NOTES" ]; then
            echo "CHANGELOG.md has no section for [$VERSION]. Add it before tagging." >&2
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # The in-app updater only installs files signed with this key (public key in tauri.conf.json)
      - name: Check the updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "Repository secret TAURI_SIGNING_PRIVATE_KEY is missing (see README, Releases)." >&2
            exit 1
          fi

      # Bundling downloads NSIS / AppImage tools from github.com/tauri-apps/binary-releases, which
      # sometimes answers 504 to runners for a while. Try up to three times; the compiled code is
      # reused, so a retry only redoes the bundling.
      - name: Build and publish the GitHub Release (attempt 1)
        id: build1
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ env.TAG }}
          releaseName: Checkpoint ${{ env.TAG }}
          releaseBody: |
            ## What's new

            ${{ steps.notes.outputs.body }}

            ## Install

            **Windows:** download `Checkpoint_${{ env.VERSION }}_x64-setup.exe` and run it.
            **Bazzite / Linux:** download the `.AppImage`, right-click → Properties → allow executing (or `chmod +x`), then open it.

            Setup guide, including connecting Google Drive: see the project website. Full history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          releaseDraft: false
          prerelease: ${{ contains(env.TAG, '-') }}

      - name: Wait before retry 1
        if: steps.build1.outcome == 'failure'
        shell: bash
        run: sleep 90

      - name: Build and publish the GitHub Release (attempt 2)
        id: build2
        if: steps.build1.outcome == 'failure'
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ env.TAG }}
          releaseName: Checkpoint ${{ env.TAG }}
          releaseBody: |
            ## What's new

            ${{ steps.notes.outputs.body }}

            ## Install

            **Windows:** download `Checkpoint_${{ env.VERSION }}_x64-setup.exe` and run it.
            **Bazzite / Linux:** download the `.AppImage`, right-click → Properties → allow executing (or `chmod +x`), then open it.

            Setup guide, including connecting Google Drive: see the project website. Full history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          releaseDraft: false
          prerelease: ${{ contains(env.TAG, '-') }}

      - name: Wait before retry 2
        if: steps.build2.outcome == 'failure'
        shell: bash
        run: sleep 90

      - name: Build and publish the GitHub Release (attempt 3)
        id: build3
        if: steps.build2.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ env.TAG }}
          releaseName: Checkpoint ${{ env.TAG }}
          releaseBody: |
            ## What's new

            ${{ steps.notes.outputs.body }}

            ## Install

            **Windows:** download `Checkpoint_${{ env.VERSION }}_x64-setup.exe` and run it.
            **Bazzite / Linux:** download the `.AppImage`, right-click → Properties → allow executing (or `chmod +x`), then open it.

            Setup guide, including connecting Google Drive: see the project website. Full history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          releaseDraft: false
          prerelease: ${{ contains(env.TAG, '-') }}
