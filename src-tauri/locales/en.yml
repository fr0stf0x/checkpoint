# Backend success messages (rust: t!("msg.*"))
msg:
  backup_unchanged: "%{game}: nothing changed, upload skipped."
  backup_done: "%{game}: backed up %{files} files (%{size})."
  restore_unchanged: "%{game}: the local save already matches this version."
  restore_done: "%{game}: restored %{files} files from %{device} (%{time})."
  restore_skipped_linux: "Skipped %{files} native-Linux files (not usable on Windows)."
  restore_into_account: "Written into account %{account}."

