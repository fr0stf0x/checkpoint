<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkpoint</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="side" id="nav">
      <div class="logo"><i></i>Checkpoint</div>
      <button data-view="games" class="on"><span data-i18n="nav.games">Games</span> <span class="count" id="cGames"></span></button>
      <button data-view="accounts"><span data-i18n="nav.accounts">Steam accounts</span> <span class="count" id="cAcc"></span></button>
      <button data-view="history"><span data-i18n="nav.history">History</span></button>
      <button data-view="settings"><span data-i18n="nav.settings">Settings</span></button>
      <button data-act="report"><span data-i18n="nav.report">Report bug / Feedback</span></button>
      <div class="sep"></div>
      <div class="meta" id="sideMeta"></div>
    </nav>
    <main class="pane" id="pane"></main>
  </div>
  <div id="layer"></div>
  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
