<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkpoint</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="side" id="nav">
      <div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6" fill="currentColor"/><path d="m7 12.5 3.2 3.2L17 8.8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Checkpoint</span><span class="ver" id="appVer"></span></div>
      <button data-view="games" class="on"><span class="navic" data-ic="gamepad"></span><span class="navlbl" data-i18n="nav.games">Games</span> <span class="count" id="cGames"></span></button>
      <button data-view="accounts"><span class="navic" data-ic="users"></span><span class="navlbl" data-i18n="nav.accounts">Steam accounts</span> <span class="count" id="cAcc"></span></button>
      <button data-view="history"><span class="navic" data-ic="history"></span><span class="navlbl" data-i18n="nav.history">History</span></button>
      <button data-view="settings"><span class="navic" data-ic="sliders"></span><span class="navlbl" data-i18n="nav.settings">Settings</span></button>
      <button data-act="report"><span class="navic" data-ic="bug"></span><span class="navlbl" data-i18n="nav.report">Report bug / Feedback</span></button>
      <div class="sep"></div>
      <div class="meta" id="sideMeta"></div>
    </nav>
    <main class="pane" id="pane"></main>
  </div>
  <div id="layer"></div>
  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
